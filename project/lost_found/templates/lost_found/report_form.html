{% extends "base.html" %}

{% load crispy_forms_tags %}

{% block title %}Create Report Page{% endblock %}

{% block content %}
<h1 class="container">All the Lost and Found Reports</h1>
<form method="post" enctype='multipart/form-data' class='container'>
    {% csrf_token %}
    {{form | crispy}}
    <button type="submit" class="btn btn-primary">Submit</button>
</form>
{% endblock %}
