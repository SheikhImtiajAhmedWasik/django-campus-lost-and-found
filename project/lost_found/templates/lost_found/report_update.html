{% extends "base.html" %}

{% load crispy_forms_tags %}

{% block title %}Update Report Page{% endblock %}

{% block content %}
<h1 class="container">Update Report: {{report.item_name}}</h1>
<form method="post" enctype='multipart/form-data' class='container'>
    {% csrf_token %}
    {{form | crispy}}
    <button type="submit" class="btn btn-primary">Update</button>
    <a href="{% url 'report-list' %}" class="btn btn-secondary">Back</a>
</form>
{% endblock %}
